[project]
name = "ra-policy-collector"
version = "0.1.0"
description = "科学技術政策情報の自動収集システム - RA向け政策情報アグリゲーター"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "beautifulsoup4>=4.14.3",
    "feedparser>=6.0.12",
    "httpx>=0.28.1",
    "lxml>=6.0.4",
    "pyyaml>=6.0.3",
]

[project.scripts]
ra-policy-collector = "ra_policy_collector.collector:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ra_policy_collector"]
